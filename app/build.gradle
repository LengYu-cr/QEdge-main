plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

android {
    namespace 'me.lengyu.qedge'
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "me.lengyu.qedge"
        minSdk 29
        targetSdk 36
        versionCode 14
        versionName "0.1.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    signingConfigs {
        release {
            storeFile file('qedge.jks')
            storePassword 'lengyu520.'
            keyAlias 'qedge_key'
            keyPassword 'lengyu520.'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
            minifyEnabled false
            zipAlignEnabled true
        }
    }
    
    androidResources {
        additionalParameters = ["--allow-reserved-package-id", "--package-id", "0x69"]
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3

    compileOnly libs.androidx.lifecycle.runtime.ktx
    compileOnly libs.androidx.lifecycle.viewmodel.ktx
    compileOnly libs.androidx.savedstate
    compileOnly libs.androidx.lifecycle.common.java8

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    implementation libs.dexkit
    implementation libs.protobuf.java
    compileOnly libs.xposed
    
    implementation libs.dalvik.dx

    implementation libs.kavaref.core
    implementation libs.kavaref.extension

    implementation "io.coil-kt:coil-compose:2.5.0"

    compileOnly project(':qqinterface')
}